; Moto Crash Guardian — firmware (docs/11 §9)
;
; Entornos:
;   esp32dev: firmware para ESP32 (Arduino-ESP32 3.x + NimBLE + TinyGPSPlus)
;   native:   pruebas unitarias de la lógica pura (detección y protocolo)
;
; Comandos:
;   pio run -e esp32dev              compilar
;   pio run -t upload -e esp32dev    compilar y flashear
;   pio device monitor -e esp32dev   telemetría de depuración por serial
;   pio test -e native               pruebas unitarias (requiere gcc en PATH)

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    mashleymatthews/TinyGPSPlus@^1.0.3
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
